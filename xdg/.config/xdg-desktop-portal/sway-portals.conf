# Which xdg-desktop-portal backend serves which interface under sway.
# Replaces /usr/share/xdg-desktop-portal/sway-portals.conf entirely, so
# its defaults are restated. (RemoteDesktop through luminous was for KDE
# Connect's remote input; both are gone.)
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
