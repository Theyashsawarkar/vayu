# Which xdg-desktop-portal backend serves which interface under sway.
# Replaces /usr/share/xdg-desktop-portal/sway-portals.conf entirely, so
# its defaults are restated first:
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# ...plus RemoteDesktop, which neither gtk nor wlr implements. Without it
# KDE Connect's remote input and presentation remote (phone as touchpad /
# keyboard / slide clicker) are dropped: "No such interface
# org.freedesktop.portal.RemoteDesktop" in the kdeconnect.service log.
# luminous (AUR xdg-desktop-portal-luminous) implements it for wlroots.
org.freedesktop.impl.portal.RemoteDesktop=luminous
