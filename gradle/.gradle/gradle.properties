# Vayu: an idle Gradle daemon exits after 15 minutes (the default is 3 hours).
# A project can ask for a big heap (one asks for -Xmx8G); left idle, that
# daemon sat on ~9 GB of RAM and swap. Projects' own settings still apply
# while they build; this only ends the wait afterwards.
org.gradle.daemon.idletimeout=900000
