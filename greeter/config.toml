# /etc/tuigreet/config.toml -- installed by greeter/apply.sh.
# Mocha Rosé: Catppuccin Mocha console palette (vtrgb) with a true black
# background, Terminus 12x24 patched with rounded corners and the icons
# below (build-console-font.py). Colour names index that palette.

[session]
command = "env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway:wlroots:swayfx XDG_SESSION_DESKTOP=sway DESKTOP_SESSION=sway sway"

[display]
show_time = true
# e.g. "01:12 AM  ·  Thu 01 Oct 2026". Every field is fixed width, and the
# total (28) must stay even: the box is 44 wide on 160 columns, so an odd
# width sits half a cell off its centre.
time_format = "%I:%M %p  ·  %a %d %b %Y"
show_title = true
# tuigreet-launch rewrites this line to "Ace · NN%" (plus "· charging")
custom_title = "Ace"

[remember]
username = true
session = true

[secret]
mode = "characters"
characters = "•"

[layout]
width = 44
# The clock sits on row window_padding. tuigreet-ace (tuigreet patched by
# tuigreet-center-box.patch) centres the box on the screen whatever the
# padding, so at 160x45 cells 16 puts the clock one row above the box at
# rows 18-26. Stock tuigreet lifts the box by the padding, so
# tuigreet-launch sets 0 when it has to fall back to it.
window_padding = 16
container_padding = 2

[layout.widgets]
status_position = "hidden"

[theme]
border = "red"
title = "magenta"
prompt = "lightmagenta"
input = "white"
time = "lightmagenta"
text = "gray"
button = "darkgray"
action = "darkgray"
