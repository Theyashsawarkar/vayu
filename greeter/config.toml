# /etc/tuigreet/config.toml -- installed by greeter/apply.sh.
# Mocha Rosé: Catppuccin Mocha console palette (vtrgb) with a true black
# background, Terminus 12x24 patched with rounded corners and the icons
# below (build-console-font.py). Colour names index that palette.

[session]
command = "env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway:wlroots:swayfx XDG_SESSION_DESKTOP=sway DESKTOP_SESSION=sway sway"

[display]
show_time = true
# U+F017 clock, U+F073 calendar (patched into the console font)
time_format = " %H:%M     %a %d %b"
show_title = true
# tuigreet-launch rewrites this line to "ace at <battery icon> NN%"
custom_title = "ace"

[remember]
username = true
session = true

[secret]
mode = "characters"
characters = "•"

[layout]
width = 44
# At 160x45 cells this parks the clock one row above the box: tuigreet
# pins the clock to row window_padding and lifts the box by the same.
window_padding = 7
container_padding = 2

[layout.widgets]
status_position = "hidden"

[theme]
border = "red"
title = "magenta"
prompt = "lightmagenta"
input = "white"
time = "lightmagenta"
text = "gray"
button = "darkgray"
action = "darkgray"
