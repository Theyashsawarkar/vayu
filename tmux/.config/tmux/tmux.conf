########## GENERAL ##########
set -g mouse on
set -g history-limit 200000          # Bigger buffer for long logs
set -g focus-events on               # Let apps (nvim, etc.) see focus in/out
set -g allow-passthrough on          # Pass through DCS/OSC (kitty graphics, etc.)
set -g set-clipboard on              # OSC 52 fallback for remote/nested sessions
set -s copy-command "wl-copy"        # Every built-in copy-pipe lands in the Wayland clipboard

# --- Terminal / colour ---
set -g default-terminal "tmux-256color"
# Fixed array slots, not `set -as`: this file is re-sourced on every
# `prefix r` and by the auto-reload hook, and each `-as` appended another
# copy (13 of each after a day of reloads). A slot is just overwritten.
set -s terminal-features[90] "*:RGB"
# Undercurl + coloured underlines (nvim diagnostics)
set -s terminal-overrides[90] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[91] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g status-keys vi
setw -g mode-keys vi

# kitty's extended keys so C-S-<digit> / C-Enter etc. reach tmux distinctly
set -s extended-keys on
set -s terminal-features[91] "xterm-kitty:extkeys"

# Terminal (kitty) tab/window title: "session · window"
set -g set-titles on
set -g set-titles-string "#S · #W"

# CRITICAL FOR NEOVIM: Zero delay for escape key press
set -sg escape-time 0
set -g repeat-time 400
set -g display-time 2000
set -g display-panes-time 2000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
setw -g automatic-rename on
# Shell windows are named after their directory, anything else after the
# running program (nvim, btop, ...) -- "1:zsh 2:zsh" says nothing.
setw -g automatic-rename-format '#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
setw -g aggressive-resize on

# Pane borders in the status palette; active pane gets the rose accent
set -g pane-border-lines single
set -g pane-border-style "fg=#3B4048"
set -g pane-active-border-style "fg=#D095A4"
set -g pane-border-status off
set -g message-style "bg=default,fg=#D095A4"
set -g mode-style "bg=#D095A4,fg=#0B0E14"
set -g copy-mode-match-style "bg=#3B4048,fg=#D4B25C"
set -g copy-mode-current-match-style "bg=#D4B25C,fg=#0B0E14"
set -g copy-mode-mark-style "bg=#C282CE,fg=#0B0E14"
set -g display-panes-active-colour "#D095A4"
set -g display-panes-colour "#6C7086"
setw -g clock-mode-colour "#D095A4"

# --- Stability guards ---
# Never let a stray hook / failed session-restore take the whole server down.
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy off         # Killing a session hops to the next one

########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl-a to the application" C-a send-prefix

########## SPLITS / WINDOWS ##########
# Open splits in the current directory
#
# -N notes on every custom bind below aren't just cosmetic: tmux's own
# `list-keys -N` (its built-in "attach a description to a binding"
# mechanism) only shows a note for bindings that actually have one --
# tmux's stock defaults ship with their own curated notes already, but a
# custom bind stays description-less until given one explicitly here.
# Doing it this way instead of maintaining a separate cheat-sheet file
# means tmux's own `prefix + ?` (list key bindings) AND
# scripts/.local/bin/keybind-search.py both read from this exact same
# live source -- nothing to keep in sync by hand.
bind -N "Split horizontally in current directory" | split-window -h -c "#{pane_current_path}"
bind -N "Split vertically in current directory" - split-window -v -c "#{pane_current_path}"
bind -N "New window in current directory" c new-window -c "#{pane_current_path}"
bind -N "Swap window left" -r < swap-window -d -t -1
bind -N "Swap window right" -r > swap-window -d -t +1

bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; run-shell -b "notify-send -a tmux -i utilities-terminal 'tmux' 'Config reloaded'"

########## NOTIFICATIONS ##########
# Route alerts through mako (notify-send) instead of tmux's own status-line
# message/highlight, so every notification looks the same as the rest of
# the desktop. Bells in background windows become a mako toast; the
# in-bar highlight styles are neutralised.
set -g visual-bell off
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style default
set -g window-status-activity-style default
set-hook -g alert-bell 'run-shell -b "notify-send -a tmux -i utilities-terminal \"tmux: #{session_name}\" \"Bell in window #{window_index}:#{window_name}\""'

########## POPUPS ##########
# Popups stay transparent (bg=default, like the bar) and run the tool
# directly -- no nested tmux inside a popup. popup.sh centres them in the
# pane area instead of the whole client (see the script for why).
# `prefix :` opens a centered floating prompt (fzf in a popup) instead of
# tmux's bottom-line prompt. Errors go to mako.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#D095A4"
set -g popup-style "bg=default,fg=#D7DDE6"

# Right-click / display-menu menus in the same style
set -g menu-style "bg=default,fg=#D7DDE6"
set -g menu-selected-style "bg=#D095A4,fg=#0B0E14"
set -g menu-border-style "fg=#D095A4"
set -g menu-border-lines rounded
# The popup only collects the line; the binding then sources it in THIS
# client's context (see cmd_prompt.sh for why it can't run tmux itself).
# run (no -b) blocks until the popup closes, so source-file sees the result.
bind -N "Floating command prompt" : run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\"" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Session picker (preview, ctrl-x kill, type new name to create)" s run -b "~/.tmux/scripts/popup.sh '#{client_name}' 70 65 -E -B ~/.tmux/scripts/sessionizer.sh '#{client_name}'"
# Confirmations are small centred menus instead of a y/n prompt in the bar
bind -N "Kill current pane" x display-menu -x C -y C -T "#[align=centre] kill pane #P? " "Kill" y kill-pane "Cancel" n ""
bind -N "Kill current window" & display-menu -x C -y C -T "#[align=centre] kill window #W? " "Kill" y kill-window "Cancel" n ""
bind -N "Kill current session (hops to the next one)" K display-menu -x C -y C -T "#[align=centre] kill session #S? " "Kill" y kill-session "Cancel" n ""
bind -N "Kill all other sessions" M-k display-menu -x C -y C -T "#[align=centre] kill every session except #S? " "Kill others" y "kill-session -a" "Cancel" n ""

# Renames use the same floating input as prefix :, prefilled
bind -N "Rename window" , run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename window ' '##{window_name}' 'rename-window --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Rename window" R run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename window ' '##{window_name}' 'rename-window --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Rename session" '$' run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename session ' '##{session_name}' 'rename-session --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"

bind -N "Classic session/window tree" w choose-tree -Zs
bind -N "Lazygit popup in current directory" g run -b "~/.tmux/scripts/popup.sh '#{client_name}' 90 88 -E -d '#{pane_current_path}' -T ' 󰊢 lazygit ' lazygit"
bind -N "Scratch shell popup (exit or C-d closes)" t run -b "~/.tmux/scripts/popup.sh '#{client_name}' 80 75 -E -d '#{pane_current_path}' -T '  scratch ' \"\$SHELL\""
bind -N "btop popup" T run -b "~/.tmux/scripts/popup.sh '#{client_name}' 90 88 -E -T ' 󰄨 btop ' btop"

########## NAVIGATION ##########
bind -n -N "Move focus to the pane on the left" M-Left select-pane -L
bind -n -N "Move focus to the pane on the right" M-Right select-pane -R
bind -n -N "Move focus to the pane above" M-Up select-pane -U
bind -n -N "Move focus to the pane below" M-Down select-pane -D

bind -n -N "Resize pane left by 5" M-S-Left resize-pane -L 5
bind -n -N "Resize pane right by 5" M-S-Right resize-pane -R 5
bind -n -N "Resize pane up by 2" M-S-Up resize-pane -U 2
bind -n -N "Resize pane down by 2" M-S-Down resize-pane -D 2

bind -n -N "Select window 1" C-S-1 if -F '#{e|<=:1,#{session_windows}}' 'select-window -t 1'
bind -n -N "Select window 2" C-S-2 if -F '#{e|<=:2,#{session_windows}}' 'select-window -t 2'
bind -n -N "Select window 3" C-S-3 if -F '#{e|<=:3,#{session_windows}}' 'select-window -t 3'
bind -n -N "Select window 4" C-S-4 if -F '#{e|<=:4,#{session_windows}}' 'select-window -t 4'
bind -n -N "Select window 5" C-S-5 if -F '#{e|<=:5,#{session_windows}}' 'select-window -t 5'
bind -n -N "Select window 6" C-S-6 if -F '#{e|<=:6,#{session_windows}}' 'select-window -t 6'

# Alt+<n> window switch: works in every terminal (C-S-<n> needs extended keys)
bind -n -N "Select window 1" M-1 if -F '#{e|<=:1,#{session_windows}}' 'select-window -t 1'
bind -n -N "Select window 2" M-2 if -F '#{e|<=:2,#{session_windows}}' 'select-window -t 2'
bind -n -N "Select window 3" M-3 if -F '#{e|<=:3,#{session_windows}}' 'select-window -t 3'
bind -n -N "Select window 4" M-4 if -F '#{e|<=:4,#{session_windows}}' 'select-window -t 4'
bind -n -N "Select window 5" M-5 if -F '#{e|<=:5,#{session_windows}}' 'select-window -t 5'
bind -n -N "Select window 6" M-6 if -F '#{e|<=:6,#{session_windows}}' 'select-window -t 6'
bind -n -N "Select window 7" M-7 if -F '#{e|<=:7,#{session_windows}}' 'select-window -t 7'
bind -n -N "Select window 8" M-8 if -F '#{e|<=:8,#{session_windows}}' 'select-window -t 8'
bind -n -N "Select window 9" M-9 if -F '#{e|<=:9,#{session_windows}}' 'select-window -t 9'

bind -N "Toggle pane zoom" z resize-pane -Z
bind -N "Toggle synchronized input to all panes" S setw synchronize-panes \; run -b "notify-send -a tmux -i utilities-terminal tmux 'Synchronized panes #{?synchronize-panes,on,off}'"
bind -N "Last session" L if -F '#{client_last_session}' 'switch-client -l'

########## COPY MODE (vi, Wayland clipboard) ##########
# Use 'v' to begin selection, and 'y' to yank to Wayland clipboard
bind -N "Enter copy mode" Enter copy-mode
bind-key -N "Begin visual selection (copy mode)" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Toggle rectangle/block selection (copy mode)" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy selection to Wayland clipboard (copy mode)" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -N "Cancel copy mode" -T copy-mode-vi Escape send-keys -X cancel
bind-key -N "Jump to start of line (copy mode)" -T copy-mode-vi H send-keys -X start-of-line
bind-key -N "Jump to end of line (copy mode)" -T copy-mode-vi L send-keys -X end-of-line
bind-key -N "Copy mouse selection to Wayland clipboard" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

########## STATUS BAR (Soft filled pills, pastel, icons throughout) ##########
set -g status-position top
set -g status-interval 5              # docker_status.sh runs `docker ps` each tick
set -g status-justify centre
set -g @surface "default"
set -g @rose "#D095A4"
set -g @peach "#F2A97E"
set -g @sage "#9ED1A6"

set -g status-style "bg=#{@surface},fg=#D7DDE6"

set -g status 2
set -g status-format[1] '#[bg=#{@surface}]'

set -g @sep_left ""
set -g @sep_right ""

# Transparent bar: only the capsules are drawn, no bar background
# (@surface = default, so status-style, the spacer row and separator caps
# all fall through to the terminal background).
# Palette #40 "Rose Dusty" (minimal): session/main = #D095A4 (also the
# shell prompt), active window = soft gold, docker
# = steel blue, inactive = gray, date = sage, time = orchid. Capsule text is
# one dark ink (#0B0E14).

set -g status-left-length 40
# Session capsule: rose normally, peach while prefix is held, sage in copy mode
set -g status-left " #[fg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}},bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}}]   #S #[fg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}},bg=#{@surface}]#{@sep_right}#[default] "

# Active window: gold. Inactive: gray-blue.
setw -g window-status-current-format "#[fg=#D4B25C,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#D4B25C] #I:#W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,} #[fg=#D4B25C,bg=#{@surface}]#{@sep_right}#[default] "
setw -g window-status-format "#[fg=#9A9FAA,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#9A9FAA] #I:#W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,} #[fg=#9A9FAA,bg=#{@surface}]#{@sep_right}#[default] "

set -g status-right-length 60
set -g status-right "#[fg=#6C8EBF,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#6C8EBF] #( ~/.tmux/scripts/docker_status.sh ) #[fg=#6C8EBF,bg=#{@surface}]#{@sep_right}#[default] #[fg=#9ED1A6,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#9ED1A6]   %a %b %d #[fg=#9ED1A6,bg=#{@surface}]#{@sep_right}#[default] #[fg=#C282CE,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#C282CE]   %I:%M %p #[fg=#C282CE,bg=#{@surface}]#{@sep_right}#[default] "

########## PLUGINS ##########
# Pinned explicitly rather than left to TPM's own default-detection: TPM's
# bootstrap script (set_default_tpm_path in its own `tpm` executable) checks
# whether ~/.config/tmux/tmux.conf exists and, if so, silently redirects
# TMUX_PLUGIN_MANAGER_PATH to ~/.config/tmux/plugins/ instead of the classic
# ~/.tmux/plugins/ -- which is exactly where this tmux.conf lives (XDG-style
# stow layout). install.sh clones TPM itself to ~/.tmux/plugins/tpm and
# never knew about this redirect, so the actual managed plugins
# (tmux-resurrect, tmux-continuum, even a second copy of tpm from the
# @plugin line below) were quietly living inside ~/.config/tmux/plugins/ --
# i.e. inside this git repo itself via the stow symlink, untracked, with
# their own nested .git dirs. Found auditing the repo for redundant/
# uncoordinated config. Setting this explicitly (before `run` below) stops
# TPM's own redirect from ever kicking in, keeping all plugin management in
# one place that matches install.sh's actual clone target.
# Auto-bootstrap tpm on a fresh machine (placed here so it runs before `run` below).
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'          # prefix Tab: fuzzy-pick paths/URLs/words from the pane

# --- resurrect / continuum ---
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- extrakto ---
set -g @extrakto_popup_size '70%,50%'
set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_fzf_layout 'reverse'

########## INITIALIZE ##########
# continuum auto-saves via a #(continuum_save.sh) it prepends to
# status-right -- but only after guessing "no other tmux server is running"
# by counting every process whose command starts with `tmux`. Any tmux
# command that happens to be running during a reload (a popup script, a
# `tmux set ...` from a shell) fails that guess, status-right above was
# just reset, and auto-save silently stops until the next lucky reload.
# So the hook is added here instead, deterministically, on the default
# socket only (a `tmux -L test` server loading this file must never
# overwrite the real saves). continuum sees it's present and adds nothing.
%if "#{m:*/default,#{socket_path}}"
set -ga status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
%endif

run '~/.tmux/plugins/tpm/tpm'

# Save / restore sessions report through mako only, never the bar (see
# resurrect.sh). Bound after tpm so they replace resurrect's own C-s/C-r;
# continuum's boot-time auto-restore reads the path option ~1s later.
bind -N "Save sessions (resurrect)" C-s run -b "~/.tmux/scripts/resurrect.sh save"
bind -N "Restore saved sessions (resurrect)" C-r run -b "~/.tmux/scripts/resurrect.sh restore"
set -g @resurrect-restore-script-path "$HOME/.tmux/scripts/resurrect.sh"

########## AUTO-RELOAD ##########
# kitty always attaches to the long-lived `main` server (and continuum keeps
# it alive), so edits to this file never reached it until a manual `prefix r`.
# Stamp the load time, and re-source on attach if the file is newer.
run -b 'tmux set -g @conf_loaded "$(date +%s)"'
set-hook -g client-attached[99] 'run -b "[ \"$(stat -Lc %Y ~/.config/tmux/tmux.conf)\" -gt \"#{@conf_loaded}\" ] && tmux source-file ~/.config/tmux/tmux.conf && notify-send -a tmux -i utilities-terminal tmux \"tmux.conf changed: reloaded\" || true"'
