########## GENERAL ##########
set -g mouse on
set -g history-limit 200000          # Bigger buffer for long logs
set -g focus-events on               # Let apps (nvim, etc.) see focus in/out
set -g allow-passthrough on          # Pass through DCS/OSC (kitty graphics, etc.)
set -g set-clipboard on              # OSC 52 fallback for remote/nested sessions
set -s copy-command "wl-copy"        # Every built-in copy-pipe lands in the Wayland clipboard
# A server started from a terminal Vyom launched (before Vyom 0.3.1) got its
# LD_PRELOAD=libgtk4-layer-shell, and every shell, hook and command in it
# then loaded GTK 4: ~35 ms per process, a new pane's shell 0.6 s, not 0.24.
# (`case`, not ${x##...}: tmux turns ## into # in the command.)
if -b 'case "$LD_PRELOAD" in *libgtk4-layer-shell*) true ;; *) false ;; esac' 'set-environment -gu LD_PRELOAD'

# --- Terminal / colour ---
set -g default-terminal "tmux-256color"
# Fixed array slots, not `set -as`: this file is re-sourced on every
# `prefix r` and by the auto-reload hook, and each `-as` appended another
# copy (13 of each after a day of reloads). A slot is just overwritten.
set -s terminal-features[90] "*:RGB"
# Undercurl + coloured underlines (nvim diagnostics)
set -s terminal-overrides[90] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[91] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g status-keys vi
setw -g mode-keys vi

# kitty's extended keys so C-S-<digit> / C-Enter etc. reach tmux distinctly
set -s extended-keys on
set -s terminal-features[91] "xterm-kitty:extkeys"

# Terminal (kitty) tab/window title: "session · window"
set -g set-titles on
set -g set-titles-string "#S · #W"

# CRITICAL FOR NEOVIM: Zero delay for escape key press
set -sg escape-time 0
set -g repeat-time 400
set -g display-time 2000
set -g display-panes-time 2000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
setw -g automatic-rename on
# Shell windows are named after their directory, anything else after the
# running program (nvim, btop, ...) -- "1:zsh 2:zsh" says nothing.
setw -g automatic-rename-format '#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
setw -g aggressive-resize on

# Pane borders in the status palette; active pane gets the rose accent
set -g pane-border-lines single
set -g pane-border-style "fg=#3B4048"
set -g pane-active-border-style "fg=#D095A4"
set -g pane-border-status off
set -g message-style "bg=default,fg=#D095A4"
set -g mode-style "bg=#D095A4,fg=#0B0E14"
# tmux 3.6+: selection and position default to "#{E:mode-style}", which
# renders unstyled, so a copy-mode selection had no visible highlight.
set -g copy-mode-selection-style "bg=#D095A4,fg=#0B0E14"
set -g copy-mode-position-style "bg=#D095A4,fg=#0B0E14"
set -g copy-mode-match-style "bg=#3B4048,fg=#D4B25C"
set -g copy-mode-current-match-style "bg=#D4B25C,fg=#0B0E14"
set -g copy-mode-mark-style "bg=#C282CE,fg=#0B0E14"
set -g display-panes-active-colour "#D095A4"
set -g display-panes-colour "#6C7086"
setw -g clock-mode-colour "#D095A4"

# --- Stability guards ---
# Never let a stray hook / failed session-restore take the whole server down.
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy off         # Killing a session hops to the next one

########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl-a to the application" C-a send-prefix

########## SPLITS / WINDOWS ##########
# Open splits in the current directory
#
# -N notes on every custom bind below aren't just cosmetic: tmux's own
# `list-keys -N` (its built-in "attach a description to a binding"
# mechanism) only shows a note for bindings that actually have one --
# tmux's stock defaults ship with their own curated notes already, but a
# custom bind stays description-less until given one explicitly here.
# Doing it this way instead of maintaining a separate cheat-sheet file
# means tmux's own `prefix + ?` (list key bindings) AND
# scripts/.local/bin/keybind-search.py both read from this exact same
# live source -- nothing to keep in sync by hand.
unbind |
bind -N "Split pane horizontally (side by side, current directory)" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically (current directory)" - split-window -v -c "#{pane_current_path}"
bind -N "Create new window (current directory)" c new-window -c "#{pane_current_path}"
bind -N "Swap window left" -r < swap-window -d -t -1
bind -N "Swap window right" -r > swap-window -d -t +1

bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; run-shell -b "notify-send -a tmux -i utilities-terminal 'tmux' 'Config reloaded'"

########## NOTIFICATIONS ##########
# Route alerts through mako (notify-send) instead of tmux's own status-line
# message/highlight, so every notification looks the same as the rest of
# the desktop. Bells in background windows become a mako toast; the
# in-bar highlight styles are neutralised.
set -g visual-bell off
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style default
set -g window-status-activity-style default
set-hook -g alert-bell 'run-shell -b "notify-send -a tmux -i utilities-terminal \"tmux: #{session_name}\" \"Bell in window #{window_index}:#{window_name}\""'

########## POPUPS ##########
# Every tool popup has the rounded rose border with the tool's name top
# left (lazygit, pull requests, sessions, keys, scratch, btop, vesha, kaushal).
# Popups stay transparent (bg=default, like the bar) and run the tool
# directly -- no nested tmux inside a popup. popup.sh centres them in the
# pane area instead of the whole client (see the script for why).
# `prefix :` opens a centered floating prompt (fzf in a popup) instead of
# tmux's bottom-line prompt. Errors go to mako.
# One size for every popup (percent of the pane area), read by popup.sh.
# Keep @extrakto_popup_size below equal to it.
set -g @popup_width 96
set -g @popup_height 94
set -g popup-border-lines rounded
set -g popup-border-style "fg=#D095A4"
set -g popup-style "bg=default,fg=#D7DDE6"

# Right-click / display-menu menus in the same style
set -g menu-style "bg=default,fg=#D7DDE6"
set -g menu-selected-style "bg=#D095A4,fg=#0B0E14"
set -g menu-border-style "fg=#D095A4"
set -g menu-border-lines rounded
# The popup only collects the line; the binding then sources it in THIS
# client's context (see cmd_prompt.sh for why it can't run tmux itself).
# run (no -b) blocks until the popup closes, so source-file sees the result.
bind -N "Open command prompt (floating)" : run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\"" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Open session picker (previews, Ctrl+x kills, a new name creates)" s run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -T ' 󰍹 sessions ' ~/.tmux/scripts/sessionizer.sh '#{client_name}'"
# Confirmations are small centred menus instead of a y/n prompt in the bar
bind -N "Kill current pane" x display-menu -x C -y C -T "#[align=centre] kill pane #P? " "Kill" y kill-pane "Cancel" n ""
bind -N "Kill current window" & display-menu -x C -y C -T "#[align=centre] kill window #W? " "Kill" y kill-window "Cancel" n ""
bind -N "Kill current session (hops to the next one)" X display-menu -x C -y C -T "#[align=centre] kill session #S? " "Kill" y kill-session "Cancel" n ""
bind -N "Kill all other sessions" M-k display-menu -x C -y C -T "#[align=centre] kill every session except #S? " "Kill others" y "kill-session -a" "Cancel" n ""

# Renames use the same floating input as prefix :, prefilled
bind -N "Rename window" , run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename window ' '##{window_name}' 'rename-window --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Rename window" R run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename window ' '##{window_name}' 'rename-window --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"
bind -N "Rename session" '$' run "~/.tmux/scripts/cmd_prompt.sh '#{client_name}' \"$HOME/.cache/tmux/cmd-#{client_pid}\" ' Rename session ' '##{session_name}' 'rename-session --'" \; source-file -Fq "$HOME/.cache/tmux/cmd-#{client_pid}"

bind -N "Search tmux keybindings, Enter runs the picked one" ? run -b "~/.tmux/scripts/tmux_keys.sh '#{client_name}'"
bind -N "Show session/window tree (classic)" w choose-tree -Zs
# lazygit takes the theme's colours from varna's file merged over its config
# (popups start from tmux's environment, not zsh's, so set it here too).
run -b 'f="$HOME/.local/state/varna/lazygit.yml"; [ -f "$f" ] && tmux set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$f" || true'
bind -N "Open lazygit popup (current directory)" g run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -d '#{pane_current_path}' -T ' 󰊢 lazygit ' lazygit"
# prefix G (sangam, the pull requests popup), prefix e (sandesh, mail and
# chat), prefix P (pattan, ports and tunnels), prefix D (nauka, Docker) and
# prefix B (prasar, posts to X and LinkedIn) come from their plugins, below.
bind -N "Open scratch shell popup (exit or Ctrl+d closes)" t run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -d '#{pane_current_path}' -T '  scratch ' \"\$SHELL\""
bind -N "Open btop popup" T run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -T ' 󰄨 btop ' btop -c ~/.local/state/varna/btop.conf"
bind -N "Open Claude account switcher popup (vesha, current directory)" C run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -d '#{pane_current_path}' -T ' 󰚩 vesha ' \"$HOME/.local/bin/vesha\""
bind -N "Open kaushal popup (skills and tools for every AI agent)" A run -b "~/.tmux/scripts/popup.sh '#{client_name}' -E -d '#{pane_current_path}' -T ' ✦ kaushal ' \"$HOME/.local/bin/kaushal\" ui"

########## NAVIGATION ##########
# Vim keys only, never arrows (a 60% keyboard has no arrow row): prefix
# h/j/k/l moves between panes, prefix H/J/K/L resizes, prefix - and
# backslash split. No arrow binding anywhere, tmux's own defaults included, and none
# without the prefix, so Alt+arrows reach the program in the pane.
# Unbound explicitly: re-sourcing this file never removes a binding a
# running server already has.
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down
unbind -n M-S-Left
unbind -n M-S-Right
unbind -n M-S-Up
unbind -n M-S-Down
# tmux's defaults: prefix arrows (focus), C-/M-arrows (resize), S-arrows (scroll the view)
unbind Left
unbind Right
unbind Up
unbind Down
unbind C-Left
unbind C-Right
unbind C-Up
unbind C-Down
unbind M-Left
unbind M-Right
unbind M-Up
unbind M-Down
unbind S-Left
unbind S-Right
unbind S-Up
unbind S-Down
# Floating panes (tmux 3.8's move table): h/j/k/l place one at an edge,
# Alt+h/j/k/l also make it that half of the window.
unbind -T move Left
unbind -T move Right
unbind -T move Up
unbind -T move Down
unbind -T move M-Left
unbind -T move M-Right
unbind -T move M-Up
unbind -T move M-Down
bind -T move -N "Move the floating pane to the left edge" h move-pane -P centre-left
bind -T move -N "Move the floating pane to the bottom edge" j move-pane -P bottom-centre
bind -T move -N "Move the floating pane to the top edge" k move-pane -P top-centre
bind -T move -N "Move the floating pane to the right edge" l move-pane -P centre-right
bind -T move -N "Make the floating pane the left half" M-h resize-pane -x "50%" -y "100%" \; move-pane -P centre-left
bind -T move -N "Make the floating pane the bottom half" M-j resize-pane -x "100%" -y "50%" \; move-pane -P bottom-centre
bind -T move -N "Make the floating pane the top half" M-k resize-pane -x "100%" -y "50%" \; move-pane -P top-centre
bind -T move -N "Make the floating pane the right half" M-l resize-pane -x "50%" -y "100%" \; move-pane -P centre-right

# Vim-style pane focus (prefix h/j/k/l; replaces prefix l = last window)
bind -N "Move focus to the pane on the left" h select-pane -L
bind -N "Move focus to the pane below" j select-pane -D
bind -N "Move focus to the pane above" k select-pane -U
bind -N "Move focus to the pane on the right" l select-pane -R
# prefix n/p cycle windows (the capsules), wrapping from last to first
bind -N "Switch to next window (wraps around)" n next-window
bind -N "Switch to previous window (wraps around)" p previous-window
# prefix Shift+h/j/k/l resizes; -r repeats, so prefix H H H keeps going
bind -r -N "Resize pane left by 5" H resize-pane -L 5
bind -r -N "Resize pane down by 2" J resize-pane -D 2
bind -r -N "Resize pane up by 2" K resize-pane -U 2
bind -r -N "Resize pane right by 5" L resize-pane -R 5

# Alt+<n> window switch. (Ctrl+Shift+<n> used to as well, but kitty keeps
# Ctrl+Shift+<n> for its own windows, so tmux never saw those keys.)
bind -n -N "Select window 1" M-1 if -F '#{e|<=:1,#{session_windows}}' 'select-window -t 1'
bind -n -N "Select window 2" M-2 if -F '#{e|<=:2,#{session_windows}}' 'select-window -t 2'
bind -n -N "Select window 3" M-3 if -F '#{e|<=:3,#{session_windows}}' 'select-window -t 3'
bind -n -N "Select window 4" M-4 if -F '#{e|<=:4,#{session_windows}}' 'select-window -t 4'
bind -n -N "Select window 5" M-5 if -F '#{e|<=:5,#{session_windows}}' 'select-window -t 5'
bind -n -N "Select window 6" M-6 if -F '#{e|<=:6,#{session_windows}}' 'select-window -t 6'
bind -n -N "Select window 7" M-7 if -F '#{e|<=:7,#{session_windows}}' 'select-window -t 7'
bind -n -N "Select window 8" M-8 if -F '#{e|<=:8,#{session_windows}}' 'select-window -t 8'
bind -n -N "Select window 9" M-9 if -F '#{e|<=:9,#{session_windows}}' 'select-window -t 9'

bind -N "Toggle pane zoom" z resize-pane -Z
bind -N "Toggle synchronized input to all panes" S setw synchronize-panes \; run -b "notify-send -a tmux -i utilities-terminal tmux 'Synchronized panes #{?synchronize-panes,on,off}'"
bind -N "Switch to last session" b if -F '#{client_last_session}' 'switch-client -l'

########## COPY MODE (vi, Wayland clipboard) ##########
# Use 'v' to begin selection, and 'y' to yank to Wayland clipboard
bind -N "Enter copy mode" Enter copy-mode
bind-key -N "Begin visual selection (copy mode)" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Toggle rectangle/block selection (copy mode)" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy selection to Wayland clipboard (copy mode)" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -N "Cancel copy mode" -T copy-mode-vi Escape send-keys -X cancel
bind-key -N "Jump to start of line (copy mode)" -T copy-mode-vi H send-keys -X start-of-line
bind-key -N "Jump to end of line (copy mode)" -T copy-mode-vi L send-keys -X end-of-line
# Mouse: a drag copies but keeps the highlight (click, Esc or q leaves);
# double-click copies a word, triple-click a line, in or out of copy mode
# (outside it, apps that use the mouse themselves still get the clicks).
bind-key -N "Copy mouse selection to Wayland clipboard (keeps the highlight)" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -N "Clear the mouse selection (copy mode)" -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -N "Copy the clicked word to Wayland clipboard (copy mode)" -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -N "Copy the clicked line to Wayland clipboard (copy mode)" -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -n -N "Copy the double-clicked word to Wayland clipboard" DoubleClick1Pane if -F "#{||:#{alternate_on},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -M ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear "wl-copy" }
bind-key -n -N "Copy the triple-clicked line to Wayland clipboard" TripleClick1Pane if -F "#{||:#{alternate_on},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -M ; send-keys -X select-line ; send-keys -X copy-pipe-no-clear "wl-copy" }

########## STATUS BAR (Soft filled pills, pastel, icons throughout) ##########
set -g status-position top
set -g status-interval 15             # no #() jobs, nothing is run: values are pushed in (below)
set -g status-justify centre
set -g @surface "default"
# Colours: varna (Vayu's theme engine) sets these from the theme, at the end
# of this file; the values here are Vayu's own, the fallback without it.
# @accent = waybar's active workspace and the session; @accent2 (the
# theme's second colour) = the current window, the active pane's border and
# popups; @ink = text on capsules.
set -g @rose "#F5C2E7"
set -g @accent2 "#F5C2E7"
set -g @accent "#CBA6F7"
set -g @ink "#0B0E14"
set -g @fg "#D7DDE6"
# Solid capsules ("look here"), all different in every theme (varna tests it):
set -g @prefix "#F2A97E"      # the session while prefix is held
set -g @copy "#9ED1A6"        # the session in copy mode
set -g @window "#F5C2E7"      # the current window
set -g @attention "#C282CE"   # Claude sessions waiting for you
# Soft pills (everything else): a dark fill, the icon in its own colour.
set -g @soft_bg "#45475A"
set -g @soft_fg "#D7DDE6"
set -g @soft_dim "#A6ADC8"
set -g @warn_bg "#8D857C"   # usage high: the soft pill, tinted with @warn
set -g @window_idle "#9A9FAA"
set -g @prs "#C282CE"
set -g @docker "#6C8EBF"
set -g @dev "#89DCEB"
set -g @mail "#F9E2AF"
set -g @chat "#94E2D5"
set -g @ok "#A6E3A1"
set -g @warn "#F9E2AF"
set -g @error "#F38BA8"

set -g status-style "bg=#{@surface},fg=#{@fg}"

set -g status 2
set -g status-format[1] '#[bg=#{@surface}]'

set -g @sep_left ""
set -g @sep_right ""

# Transparent bar: only the capsules are drawn, no bar background
# (@surface = default, so status-style, the spacer row and separator caps
# all fall through to the terminal background).
# Two kinds of capsule, like waybar's pills. Solid (a fill, dark ink text)
# means "look here": the session (the accent; @prefix while prefix is held,
# @copy in copy mode), the current window (@window), Claude waiting
# (@attention) and usage at its limit (@error). Everything else is a soft
# pill: @soft_bg with the icon in its own colour (other windows, usage, PRs,
# dev servers, docker), so the bar needs few distinct colours and no two
# solid capsules share one in any theme.
#
# A development bar: no date or time (waybar shows them right above).
# Left: the session. Middle:
# the windows, each with an icon for what it runs. Right: PRs waiting for
# your review (and your own open ones), dev servers (an icon per kind with
# how many ports), running containers, each only when there are any.
# Every value is pushed in, never polled: @gh_reviews, @gh_prs, @dev_ports
# and @docker_count by bar-events.py.

set -g status-left-length 80
# Session capsule: rose normally, peach while prefix is held, sage in copy
# mode, and it says which.
set -g @session_color "#{?client_prefix,#{@prefix},#{?pane_in_mode,#{@copy},#{@accent}}}"
set -g status-left " #[fg=#{E:@session_color},bg=#{@surface}]#{@sep_left}#[fg=#{@ink},bg=#{E:@session_color}]   #S#{?client_prefix, · PREFIX,}#{?pane_in_mode, · COPY,} #[fg=#{E:@session_color},bg=#{@surface}]#{@sep_right}#[default] "

# Window icon from what its active pane runs (nested #{?}: no jobs).
set -g @wicon "#{?#{m/r:^n?vim?$,#{pane_current_command}},,#{?#{==:#{pane_current_command},lazygit},󰊢,#{?#{m/r:^(node|npm|pnpm|bun|deno)$,#{pane_current_command}},󰎙,#{?#{m/r:^python,#{pane_current_command}},,#{?#{m/r:^(docker|lazydocker)$,#{pane_current_command}},,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},󰣀,#{?#{m/r:^(btop|htop|top)$,#{pane_current_command}},󰍛,#{?#{m/r:^(rmpc|mpv)$,#{pane_current_command}},󰝚,}}}}}}}}"

# Current window: solid @window. The others: soft pills. The style is pinned to default:
# tmux's built-in window-status-current-style can be "underscore", which
# drew a line under the active capsule.
setw -g window-status-current-style default
setw -g window-status-current-format "#[fg=#{@window},bg=#{@surface}]#{@sep_left}#[fg=#{@ink},bg=#{@window}] #{E:@wicon} #I #W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,} #[fg=#{@window},bg=#{@surface}]#{@sep_right}#[default] "
setw -g window-status-format "#[fg=#{@soft_bg},bg=#{@surface}]#{@sep_left}#[fg=#{@window_idle},bg=#{@soft_bg}] #{E:@wicon} #[fg=#{@soft_dim}]#I #W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,}#{?window_activity_flag,#[fg=#{@attention}] ●,} #[fg=#{@soft_bg},bg=#{@surface}]#{@sep_right}#[default] "

set -g status-right-length 80
# status-right itself is set after tpm, below (INITIALIZE).

########## PLUGINS ##########
# Pinned explicitly rather than left to TPM's own default-detection: TPM's
# bootstrap script (set_default_tpm_path in its own `tpm` executable) checks
# whether ~/.config/tmux/tmux.conf exists and, if so, silently redirects
# TMUX_PLUGIN_MANAGER_PATH to ~/.config/tmux/plugins/ instead of the classic
# ~/.tmux/plugins/ -- which is exactly where this tmux.conf lives (XDG-style
# stow layout). install.sh clones TPM itself to ~/.tmux/plugins/tpm and
# never knew about this redirect, so the actual managed plugins
# (tmux-resurrect, tmux-continuum, even a second copy of tpm from the
# @plugin line below) were quietly living inside ~/.config/tmux/plugins/ --
# i.e. inside this git repo itself via the stow symlink, untracked, with
# their own nested .git dirs. Found auditing the repo for redundant/
# uncoordinated config. Setting this explicitly (before `run` below) stops
# TPM's own redirect from ever kicking in, keeping all plugin management in
# one place that matches install.sh's actual clone target.
# Auto-bootstrap tpm on a fresh machine (placed here so it runs before `run` below).
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'          # prefix Tab: fuzzy-pick paths/URLs/words from the pane
# Vayu's own plugins live in their own repos (see CLAUDE.md "Plugins").
set -g @plugin 'Theyashsawarkar/sangam'       # prefix G: sangam, pull requests popup
set -g @plugin 'Theyashsawarkar/sandesh'      # prefix e: sandesh, mail and chat popup
set -g @plugin 'Theyashsawarkar/pattan'       # prefix P: pattan, ports and tunnels popup
set -g @plugin 'Theyashsawarkar/nauka'        # prefix D: nauka, Docker popup
set -g @plugin 'Theyashsawarkar/prasar'       # prefix B: prasar, posts to X and LinkedIn

# --- resurrect / continuum ---
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'   # saving is tmux-autosave.timer (INITIALIZE)

# --- extrakto ---
set -g @extrakto_popup_size '96%,94%'   # = @popup_width/@popup_height
set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_fzf_layout 'reverse'

# --- sangam --- (opens through popup.sh, like every other popup here)
set -g @sangam-launcher "~/.tmux/scripts/popup.sh '#{client_name}'"
set -g @sangam-title ' 󰊤 sangam '

# --- sandesh --- (Gmail + Google Chat; same popup.sh)
set -g @sandesh-launcher "~/.tmux/scripts/popup.sh '#{client_name}'"
set -g @sandesh-title ' 󰇮 sandesh '

# --- pattan --- (dev servers, ports, tunnels; same popup.sh)
set -g @pattan-launcher "~/.tmux/scripts/popup.sh '#{client_name}'"
set -g @pattan-title ' 󰒋 pattan '

# --- nauka --- (Docker; same popup.sh)
set -g @nauka-launcher "~/.tmux/scripts/popup.sh '#{client_name}'"
set -g @nauka-title '  nauka '

# --- prasar --- (posts to X and LinkedIn; same popup.sh)
set -g @prasar-launcher "~/.tmux/scripts/popup.sh '#{client_name}'"
set -g @prasar-title ' 󰐻 prasar '

########## INITIALIZE ##########
# continuum only restores here. Its auto-save is a #(continuum_save.sh)
# job it prepends to status-right, which ran 22 processes every 5 s
# status tick just to find 15 minutes hadn't passed. Saving is the
# tmux-autosave.timer user unit instead (default server only, so a
# `tmux -L test` server never overwrites the real saves), and
# status-right is set after tpm so it replaces whatever continuum added.
# Order: Claude waiting first (leftmost, so it catches the eye), then the
# capsules that come and go (docker, dev ports, PRs); the always-there
# Claude usage last, at the far right.

# A plugin added to the list above after this machine was set up (git pull
# of this repo, no install.sh re-run) is cloned on the next load; the check
# is a quick directory test, TPM's installer only runs when one is missing.
if "~/.tmux/scripts/plugins-missing.sh" "run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1'"
run '~/.tmux/plugins/tpm/tpm'

# Right side, each capsule only while it has something to say:
#   󰚩 N waiting   Claude sessions in other panes that finished or ask you
#                 something (claude-tmux, from Claude Code's hooks); click
#                 or prefix a jumps to the one that has waited longest
#    work 72%    the active Claude account and its 5-hour usage (vesha),
#                 green / yellow / red; shown with two accounts or more
#   󰊤 N to review PRs waiting for your review (click: sangam, like prefix G)
#   󰒋 N          dev servers you're running (dev-ports); click opens pattan
#   󰇮 N 󰭹 N      unread mail threads, chats with unread messages (sandesh);
#                 a click on either opens sandesh on that tab
#    N        running containers; click opens nauka
# Clickable capsules are status ranges, told apart from a click on a window
# by MouseDown1Status (bar-click.sh does the rest).
set -g status-right "#{?#{&&:#{@claude_waiting},#{!=:#{@claude_waiting},0}},#[range=user|claude]#[fg=#{@attention}#,bg=#{@surface}]#{@sep_left}#[fg=#{@ink}#,bg=#{@attention}] 󰚩 #{@claude_waiting} waiting #[fg=#{@attention}#,bg=#{@surface}]#{@sep_right}#[norange default] ,}#{?#{&&:#{@docker_count},#{!=:#{@docker_count},0}},#[range=user|docker]#[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_left}#[fg=#{@docker}#,bg=#{@soft_bg}]  #[fg=#{@soft_fg}]#{@docker_count} #[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_right}#[norange default] ,}#{?@dev_ports,#[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_left}#[fg=#{@dev}#,bg=#{@soft_bg}] #{E:@dev_ports_fmt} #[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_right}#[default] ,}#{?#{||:#{&&:#{@gh_reviews},#{!=:#{@gh_reviews},0}},#{&&:#{@gh_prs},#{!=:#{@gh_prs},0}}},#[range=user|prs]#[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_left}#[bg=#{@soft_bg}]#{?#{&&:#{@gh_prs},#{!=:#{@gh_prs},0}},#[fg=#{@prs}]  #[fg=#{@soft_fg}]#{@gh_prs},}#{?#{&&:#{@gh_reviews},#{!=:#{@gh_reviews},0}},#[fg=#{@prs}] 󰊤 #[fg=#{@soft_fg}]#{@gh_reviews},} #[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_right}#[norange default] ,}#{?#{||:#{&&:#{@sandesh_mail},#{!=:#{@sandesh_mail},0}},#{&&:#{@sandesh_chat},#{!=:#{@sandesh_chat},0}}},#[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_left}#[bg=#{@soft_bg}]#{?#{&&:#{@sandesh_mail},#{!=:#{@sandesh_mail},0}},#[range=user|mail]#[fg=#{@mail}] 󰇮 #[fg=#{@soft_fg}]#{@sandesh_mail}#[norange],}#{?#{&&:#{@sandesh_chat},#{!=:#{@sandesh_chat},0}},#[range=user|chat]#[fg=#{@chat}] 󰭹 #[fg=#{@soft_fg}]#{@sandesh_chat}#[norange],} #[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_right}#[default] ,}#{?@claude_limit,#[range=user|usage],}#{?@claude_limit,#{?#{==:#{@claude_limit_class},full},#[fg=#{@error}#,bg=#{@surface}]#{@sep_left}#[fg=#{@ink}#,bg=#{@error}]   #{@claude_limit} #[fg=#{@error}#,bg=#{@surface}]#{@sep_right}#[default] ,#{?#{==:#{@claude_limit_class},warn},#[fg=#{@warn_bg}#,bg=#{@surface}]#{@sep_left}#[fg=#{@warn}#,bg=#{@warn_bg}]  #[fg=#{@soft_fg}]#{@claude_limit} #[fg=#{@warn_bg}#,bg=#{@surface}]#{@sep_right}#[default] ,#[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_left}#[fg=#{@ok}#,bg=#{@soft_bg}]  #[fg=#{@soft_fg}]#{@claude_limit} #[fg=#{@soft_bg}#,bg=#{@surface}]#{@sep_right}#[default] }},}#{?@claude_limit,#[norange],}"
bind -n -N "Open the clicked capsule (Claude waiting, Claude usage, pull requests, dev servers: pattan, Docker: nauka, mail and chat: sandesh; else select the clicked window)" MouseDown1Status if -F "#{m/r:^(prs|claude|usage|docker|mail|chat|dev.*)$,#{mouse_status_range}}" "run -b \"~/.tmux/scripts/bar-click.sh '#{client_name}' '#{mouse_status_range}' '#{pane_current_path}'\"" "switch-client -t ="
bind -N "Jump to the Claude session waiting longest for you" a run -b "~/.local/bin/claude-tmux next"
# Looking at a pane clears its "waiting"; recount on load (panes may be gone).
set-hook -g after-select-pane[60] 'run -b "~/.local/bin/claude-tmux seen #{pane_id}"'
set-hook -g after-select-window[60] 'run -b "~/.local/bin/claude-tmux seen #{pane_id}"'
set-hook -g client-session-changed[60] 'run -b "~/.local/bin/claude-tmux seen #{pane_id}"'
run -b "~/.local/bin/claude-tmux count"
# The docker pill shows @docker_count, which bar-events.py sets whenever a
# container starts or stops, or the daemon does. Set once here too: tmux
# can start after bar-events.py.
run -b '~/.local/bin/bar-events.py --tmux-docker'
# And sandesh's unread counts (bar-events.py follows its local copy).
run -b '~/.local/bin/bar-events.py --tmux-sandesh'
# Same for the PR counts (bar-events.py refreshes them every 2 min, and as
# soon as the account or a PR changes).
run -b '~/.local/bin/gh-review-count --set-tmux >/dev/null'

# Save / restore sessions report through mako only, never the bar (see
# resurrect.sh). Bound after tpm so they replace resurrect's own C-s/C-r;
# continuum's boot-time auto-restore reads the path option ~1s later.
bind -N "Save sessions (resurrect)" C-s run -b "~/.tmux/scripts/resurrect.sh save"
bind -N "Restore saved sessions (resurrect)" C-r run -b "~/.tmux/scripts/resurrect.sh restore"
set -g @resurrect-restore-script-path "$HOME/.tmux/scripts/resurrect.sh"

########## AUTO-RELOAD ##########
# kitty always attaches to the long-lived `main` server (and continuum keeps
# it alive), so edits to this file never reached it until a manual `prefix r`.
# Stamp the load time, and re-source on attach if the file is newer.
run -b 'tmux set -g @conf_loaded "$(date +%s)"'
set-hook -g client-attached[99] 'run -b "[ \"$(stat -Lc %Y ~/.config/tmux/tmux.conf)\" -gt \"#{@conf_loaded}\" ] && tmux source-file ~/.config/tmux/tmux.conf && notify-send -a tmux -i utilities-terminal tmux \"tmux.conf changed: reloaded\" || true"'

########## THEME ##########
# varna (Vayu's theme engine) writes the theme's colours here: the @vars
# above, and the styles that can't use vars (borders, popups, copy mode).
# -q: no error without varna.
source-file -q ~/.local/state/varna/tmux.conf
