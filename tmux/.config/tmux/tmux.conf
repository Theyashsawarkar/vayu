########## GENERAL ##########
set -g mouse on
set -g history-limit 200000          # Bigger buffer for long logs
set -g default-terminal "tmux-256color"

# WAYLAND & KITTY SPECIFIC: Modern terminal overrides (fix colors)
set-option -sa terminal-overrides ",xterm-kitty:Tc"

set -g status-keys vi
setw -g mode-keys vi

# CRITICAL FOR NEOVIM: Zero delay for escape key press
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl-a to the application" C-a send-prefix

########## SPLITS ##########
# Open splits in the current directory
#
# -N notes on every custom bind below aren't just cosmetic: tmux's own
# `list-keys -N` (its built-in "attach a description to a binding"
# mechanism) only shows a note for bindings that actually have one --
# tmux's stock defaults ship with their own curated notes already, but a
# custom bind stays description-less until given one explicitly here.
# Doing it this way instead of maintaining a separate cheat-sheet file
# means tmux's own `prefix + ?` (list key bindings) AND
# scripts/.local/bin/keybind-search.py both read from this exact same
# live source -- nothing to keep in sync by hand.
bind -N "Split horizontally in current directory" | split-window -h -c "#{pane_current_path}"
bind -N "Split vertically in current directory" - split-window -v -c "#{pane_current_path}"

bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

########## NAVIGATION ##########
bind -n -N "Move focus to the pane on the left" M-Left select-pane -L
bind -n -N "Move focus to the pane on the right" M-Right select-pane -R
bind -n -N "Move focus to the pane above" M-Up select-pane -U
bind -n -N "Move focus to the pane below" M-Down select-pane -D

bind -n -N "Resize pane left by 5" M-S-Left resize-pane -L 5
bind -n -N "Resize pane right by 5" M-S-Right resize-pane -R 5
bind -n -N "Resize pane up by 2" M-S-Up resize-pane -U 2
bind -n -N "Resize pane down by 2" M-S-Down resize-pane -D 2

bind -n -N "Select window 1" C-S-1 select-window -t 1
bind -n -N "Select window 2" C-S-2 select-window -t 2
bind -n -N "Select window 3" C-S-3 select-window -t 3
bind -n -N "Select window 4" C-S-4 select-window -t 4
bind -n -N "Select window 5" C-S-5 select-window -t 5
bind -n -N "Select window 6" C-S-6 select-window -t 6

# FZF Session Picker
bind -N "Fuzzy-find and switch tmux session" s display-popup -E "session=\$(tmux list-sessions -F \"#{session_name}\" | fzf --reverse); [ -n \"\$session\" ] && tmux switch-client -t \"\$session\""

########## WAYLAND CLIPBOARD ##########
# Use 'v' to begin selection, and 'y' to yank to Wayland clipboard
bind-key -N "Begin visual selection (copy mode)" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Toggle rectangle/block selection (copy mode)" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy selection to Wayland clipboard (copy mode)" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

########## STATUS BAR (Waybar-pattern: per-module black pills) ##########
set -g status-position top
set -g status-interval 2
set -g status-justify centre
# Bar itself is transparent now, not a filled #0F172A stripe -- matches
# waybar's own real pattern exactly (style.css: "window#waybar { background:
# transparent }", each #module gets its OWN background + margin gap, not
# one continuous color spanning the whole bar). Asked directly to follow
# that pattern rather than the flat-stripe version from the previous pass.
set -g status-style "bg=default,fg=#cdd6f4"

# Margin row back to transparent too, matching the bar itself.
set -g status 2
set -g status-format[1] '#[bg=default]'

# Two cap pairs: hollow (outline) for every module that just shows colored
# text on its own black pill, filled (solid) reserved for the one thing
# that needs to visually pop out of that shared resting state -- same idea
# as waybar's sway/workspaces module, where every workspace shares one dim
# resting style except .focused, which alone gets distinct treatment.
set -g @sep_left ""
set -g @sep_right ""

# Waybar's own near-black pill fill (style.css: "Deep Midnight",
# rgba(17,17,27,0.92) = Crust #11111b) reused as-is, in place of the
# previous pass's slate #0F172A -- this pass is explicitly "follow the
# waybar pattern", so its own real hex, not a close guess.

set -g status-left-length 40
# Session: Sapphire text+corners on its own black pill; gaps either side
# fall back to bg=default (transparent), same as every module below.
set -g status-left " #[bg=#11111b,fg=#3B82F6]#{@sep_left}   #S #{@sep_right}#[bg=default]"

# Windows follow waybar's own workspace-indicator pattern directly: every
# window shares one resting style (Green text on a black pill) except the
# active one, which alone gets a solid, filled Purple pill instead --
# asked for directly, not just a brighter version of the same hollow style.
setw -g window-status-format "#[bg=#11111b,fg=#10B981]#{@sep_left} #I:#W #{@sep_right}#[bg=default]"
setw -g window-status-current-format "#[fg=#8B5CF6]#[bg=#8B5CF6,fg=#11111b] #I:#W #[bg=default,fg=#8B5CF6]"

set -g status-right-length 60
# Docker/date/time: same black-pill treatment as session -- Amber/Ruby/Cyan
# text+corners, unchanged colors from the previous pass. docker_status.sh
# still has no embedded colors of its own (real whale icon + real count).
set -g status-right "#[bg=#11111b,fg=#F59E0B]#{@sep_left} #( ~/.tmux/scripts/docker_status.sh ) #{@sep_right}#[bg=default] #[bg=#11111b,fg=#F43F5E]#{@sep_left} %A %B %d #{@sep_right}#[bg=default] #[bg=#11111b,fg=#06B6D4]#{@sep_left} %I:%M %p #{@sep_right}#[bg=default]  "

########## PLUGINS ##########
# Pinned explicitly rather than left to TPM's own default-detection: TPM's
# bootstrap script (set_default_tpm_path in its own `tpm` executable) checks
# whether ~/.config/tmux/tmux.conf exists and, if so, silently redirects
# TMUX_PLUGIN_MANAGER_PATH to ~/.config/tmux/plugins/ instead of the classic
# ~/.tmux/plugins/ -- which is exactly where this tmux.conf lives (XDG-style
# stow layout). install.sh clones TPM itself to ~/.tmux/plugins/tpm and
# never knew about this redirect, so the actual managed plugins
# (tmux-resurrect, tmux-continuum, even a second copy of tpm from the
# @plugin line below) were quietly living inside ~/.config/tmux/plugins/ --
# i.e. inside this git repo itself via the stow symlink, untracked, with
# their own nested .git dirs. Found auditing the repo for redundant/
# uncoordinated config. Setting this explicitly (before `run` below) stops
# TPM's own redirect from ever kicking in, keeping all plugin management in
# one place that matches install.sh's actual clone target.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

########## INITIALIZE ##########
run '~/.tmux/plugins/tpm/tpm'
