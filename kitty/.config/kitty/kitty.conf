# Fonts
font_family      JetBrainsMono Nerd Font
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto

# Window Layout (Sway Minimalist)
hide_window_decorations yes
window_border_width 0
draw_minimal_borders yes
background_opacity 0.85
# Kitty had no background set -- pure black by default -- so padding and
# any pane using the default bg was flat black next to tmux's warm
# Terracotta Clay surface (@surface #2A2622 in tmux.conf). Matched here
# so padding reads as breathing room in the same tone instead of a
# contrasting stripe, and panes feel like one surface with the bar
# instead of two clashing ones. Keep this in sync if @surface changes.
background #2A2622

# Remote control (lets `kitty @ ...` / kittens control this instance --
# e.g. reloading config or changing font live without a full restart)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Keybinds
map ctrl+shift+f toggle_fullscreen

# Inner window margins (Top Right Bottom Left)
# Top back to a small margin now that `background` above matches the bar
# -- the padding is Terracotta Clay's own dark tone, not raw black, so it
# frames the pills instead of striping past them.
window_padding_width 6 15 0 15
