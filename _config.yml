# GitHub Pages config -- sourced from main branch, repo root.
#
# index.html (repo root) is a fully custom static page -- no Jekyll
# front matter, so Pages serves it untouched instead of wrapping it in
# a theme layout. It's the actual homepage (index.html always wins
# over README.md/index.md as the site root when both exist).
#
# CHANGELOG.md and docs/*.md deliberately have NO front matter either
# (they're read directly on GitHub too -- linked from README.md -- and
# a `---` front-matter block isn't stripped by GitHub's own renderer,
# it shows up as literal horizontal rules on the real repo page,
# confirmed live once already for README.md and reverted). `defaults:`
# below assigns the custom `docs` layout to each of them by path
# instead, with zero change to the source files themselves.
#
# Explicit, not left to whatever profile GitHub Pages' build defaults to
# without a `theme:` key set -- found live, not assumed: fenced ```bash
# code blocks in CHANGELOG.md were rendering as literal backtick text
# instead of real <pre><code> blocks once `theme:` was removed in favor
# of the custom `docs` layout. `input: GFM` is what actually enables
# triple-backtick fence parsing in kramdown.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

title: Vayu
description: >-
  A minimal, keyboard-driven Arch Linux desktop built around Wayland, Sway,
  and modern terminal-based development tools -- Sway, Waybar, MPD/rmpc,
  Kitty, Neovim, Tmux, managed with GNU Stow. Named after the Hindu god of
  wind.

defaults:
  - scope:
      path: "docs/ARCHITECTURE.md"
    values:
      layout: "docs"
      title: "Architecture"
  - scope:
      path: "docs/VERSIONING.md"
    values:
      layout: "docs"
      title: "Versioning"
  - scope:
      path: "CHANGELOG.md"
    values:
      layout: "docs"
      title: "Changelog"
  - scope:
      path: "docs/KEYBINDINGS.md"
    values:
      layout: "docs"
      title: "Keybindings"

# Everything below is real config/dotfile content, not documentation --
# excluded so the Jekyll build only ever processes the actual docs
# (CHANGELOG.md, docs/*.md, index.html, assets/), not several hundred
# unrelated config files this repo also happens to contain. README.md
# is left unexcluded but is a raw passthrough regardless (no front
# matter, and unlike the files above, it's the one Jekyll won't build
# into README.html at all -- confirmed live, see docs/ARCHITECTURE.md).
exclude:
  - gtk/
  - kitty/
  - mako/
  - mpd/
  - networkmanager-dmenu/
  - nvim/
  - nwg-bar/
  - packages/
  - rmpc/
  - scripts/
  - sway/
  - systemd/
  - tmux/
  - waybar/
  - wofi/
  - xdg/
  - zed/
  - zsh/
  - install.sh
  # tmux palette swatchbooks (reference, moved out of the tmux stow package)
  - docs/tmux-palettes/
