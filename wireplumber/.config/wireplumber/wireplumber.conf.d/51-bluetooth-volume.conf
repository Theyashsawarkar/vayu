# Each output keeps its own volume: set the buds to 30% and they come back
# at 30% next time; disconnect them and the speakers return to theirs.
#
# WirePlumber already remembers a volume per device (device.restore-routes,
# ~/.local/state/wireplumber/default-routes). What undid it for Bluetooth
# was "hardware volume" (AVRCP absolute volume): on connect the headphones
# report their own volume and the laptop takes it, over the saved one.
# Keeping volume in software for the headphone roles (a2dp_sink, hfp_hf,
# hsp_hs) leaves the saved one in charge. Hardware volume stays for the
# reverse roles (the laptop as a speaker for a phone).
# Trade-off: the headphones' own volume buttons no longer move the
# laptop's volume.
monitor.bluez.properties = {
  bluez5.hw-volume = [ hfp_ag hsp_ag a2dp_source ]
}
