# MPD, run as a systemd --user service (mpd.service, shipped by the
# mpd package itself -- no unit needed in this repo). Default lookup
# path for a user-mode instance is exactly ~/.config/mpd/mpd.conf,
# confirmed from mpd.conf(5) directly.
#
# db_file/state_file/sticker_file deliberately go under
# ~/.local/state/mpd/, not ~/.config/mpd/ the way mpd.conf(5)'s own
# example does it -- these are runtime state (an index of what's on
# disk, playback position, song ratings), not configuration, same
# config-vs-state line this repo already draws everywhere else
# (~/.local/state/notification-mode/, termusic's own database files).

music_directory     "~/Music"
db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

# Saved playlists are real user content (like the music itself), not
# runtime state -- ~/.local/share/, not ~/.local/state/. Without this
# set at all, MPD logs "Stored playlists are disabled" on every attempt
# rmpc's own playlist features make (confirmed directly: this line
# showed up in mpd's own log the moment rmpc, already connected, tried
# to read the playlist list right after a library update).
playlist_directory  "~/.local/share/mpd/playlists"

# Rescans ~/Music automatically when it changes on disk (a new track
# from music-search.py, say) -- MPD does have the filesystem watcher
# termusic's own source turned out not to (confirmed directly reading
# termusic's source, see docs/ARCHITECTURE.md), so this is a real
# improvement, not assumed to already work the same way.
auto_update         "yes"

# Only this machine: MPD listened on every interface (*:6600), so anyone on
# the same Wi-Fi could control it, read the library and make it fetch URLs.
# The socket (MPD_HOST in .profile; rmpc and nada use it) plus localhost
# for anything that only speaks TCP. MPD expands $XDG_RUNTIME_DIR here.
bind_to_address     "$XDG_RUNTIME_DIR/mpd/socket"
bind_to_address     "localhost"

# Come back paused: a song that was playing at shutdown doesn't start
# blaring at the next login.
restore_paused      "yes"

# PipeWire's own PulseAudio-compatible socket, confirmed already
# running on this system (`pactl info` -- "Server Name: PulseAudio (on
# PipeWire ...)") -- the "pulse" output type talks to that directly,
# same audio path every other pactl-based script in this repo
# (volume_osd.sh, etc.) already goes through.
audio_output {
    type            "pulse"
    name            "PipeWire"
}
