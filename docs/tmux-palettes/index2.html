<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tmux bar palettes — minimal</title>
<style>
:root{--bg:#0d0f12;--fg:#d7dde6;--dim:#7d8794;--line:#1c2027}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,"JetBrainsMono Nerd Font","JetBrains Mono",monospace;padding:28px 16px 90px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:18px;margin:0 0 4px;font-weight:600}
p.sub{color:var(--dim);margin:0 0 18px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:#161a20;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
button.on{border-color:#7dd3fc;color:#7dd3fc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#000}
.card.sel{outline:2px solid #7dd3fc}
.term{padding:14px 12px 10px;background:#000}
body.wall .term{background:linear-gradient(135deg,#0b1a2b 0%,#1a1030 45%,#2a1420 100%)}
.status{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.grp{display:flex;gap:6px;align-items:center}
.pill{padding:2px 11px;border-radius:999px;white-space:nowrap;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#101319;border-top:1px solid var(--line);font-size:12px}
.num{color:#7dd3fc;font-weight:700;margin-right:8px}
.chips{display:flex;gap:4px}.chips i{width:14px;height:14px;border-radius:50%;display:block}
.pill.act{box-shadow:0 0 0 1px rgba(255,255,255,.45);margin:0 2px}
.prompt{margin-top:10px;font-size:13px;color:#8b93a1}.cur{display:inline-block;width:8px;height:14px;vertical-align:-2px}
.ct{color:var(--dim)}.ct.bad{color:#f87171}
#out{position:fixed;left:0;right:0;bottom:0;background:#0a0c0f;border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--dim);white-space:pre-wrap}
</style></head><body><div class="wrap">
<h1>tmux bar palettes — minimal · subtle · muted</h1>
<p class="sub">Quiet, low-saturation palettes. Session = main tone (and prompt), docker is always a soft blue, the active window is the one slightly stronger tone. Filter by the active color and pick a number.</p>
<div class="bar"><span class="ct">preview on:</span>
<button id="b1" class="on">pure black</button><button id="b2">translucent over wallpaper</button></div>
<div class="bar" id="flt"></div>
<div class="grid" id="grid"></div></div>
<div id="out">Click a palette to see its values.</div>

const INK="#0B0E14",WHITE="#FFFFFF";
const lin=v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4;
const lum=h=>{const c=[1,3,5].map(i=>lin(parseInt(h.substr(i,2),16)/255));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const inkFor=c=>cr(c,INK)>=cr(c,WHITE)?INK:WHITE;

 P.forEach((p,i)=>{ if(cur!=='All'&&p[8]!==cur)return;

  <div class="meta"><span><span class="num">${i+1}</span>${n} · <b style="color:${a}">${jn}</b></span>
  <span class="chips">${[s,a,ia,d,dt,t].map(c=>`<i style="background:${c}"></i>`).join('')}</span>
  <span class="ct">apart ΔE ${de}</span></div>`;
  el.onclick=()=>{document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
   out.textContent=`#${i+1} ${n} (${jn} active)\nsession/prompt ${s}  active ${a}  inactive ${ia}  docker ${d}  date ${dt}  time ${t}`};
  g.appendChild(el)})}
render();
b1.onclick=()=>{document.body.classList.remove('wall');b1.classList.add('on');b2.classList.remove('on')};
b2.onclick=()=>{document.body.classList.add('wall');b2.classList.add('on');b1.classList.remove('on')};
