# Vyom (github.com/Theyashsawarkar/vyom) as Vayu uses it. Each tool is its
# own repo (packages/manifest.sh VYOM_TOOLS); its settings live under
# [plugin.<name>] here, pointing it at Vayu's own scripts so state stays
# shared with waybar, mako and sway. Every key is optional: each tool's
# README lists them. Reload after editing: vyom reload

[vyom]
# Every panel opens at one size, width x height times scale (capped at
# 90% of the screen); only kendra, under the bar, keeps its own.
width = 900
height = 520
scale = 1.25
# Panel background opacity: varna's ui.glass sets it (the same glass as
# nāda, vinyasa and notifications); `opacity = ...` here only without varna.
# The theme's colours (varna, Vayu's theme engine), loaded after every style.
css = ["~/.local/state/varna/vyom.css"]

[plugin.dvara]
terminal = "kitty"

[plugin.tarang]
hotspot_command = "~/.local/bin/vayu-hotspot"

[plugin.patra]
terminal = "kitty"

# akashvani is the notification server (it replaced mako): the popups,
# their timing and sound, and rules. Its README has every setting. Modes
# (normal / silent / dnd: notification-mode.sh, Super+n) are akashvani's own.
[plugin.akashvani]
position = "top-center"         # notifications drop from the clock capsule
osd_position = "top-right"     # volume / brightness sliders stay in the corner
margin_x = 20                  # clear of the bar's pills
margin_y = 10
width = 420
max_visible = 3
timeout = 3000                 # normal; low and urgent below
timeout_low = 2000
timeout_critical = 6000
timeout_missed = 8000           # a missed call hides too (it stays in the bell's list)
ignore_timeout = true          # an app can't pin a card: only a ringing call stays
timeout_actions = 6000         # one you can act on stays a little longer
sound = "/usr/share/sounds/freedesktop/stereo/message.oga"

# The battery warning stays till you plug in (battery-warning-dismiss.sh
# dismisses it then).
[[plugin.akashvani.rules]]
app = "batsignal"
timeout = 0

# Switching the notification mode always says so, even into do not disturb.
[[plugin.akashvani.rules]]
app = "^akashvani$"
summary = "^Notifications: "
show_in_dnd = true

[plugin.mudra]
source_command = "~/.local/bin/keybind-search.py --json"

# battery-limit-watch.sh nudges you to unplug at this percentage.
[plugin.urja]
limit_file = "~/.local/state/battery-limit/threshold"

[plugin.vishram]
# vayu-lock: swaylock with the varna theme's colours, like the idle and lid locks.
lock = "~/.local/bin/vayu-lock"
logout = "swaymsg exit"

[plugin.kendra]
tiles = ["wifi", "bluetooth", "hotspot", "dnd", "jyoti", "ekatva", "theme", "wallpaper", "power-profile"]
lock = "~/.local/bin/vayu-lock"
power = "~/.local/bin/vyom vishram"

# Right click / Shift+Enter on a tile opens its full panel.
[plugin.kendra.tile.wifi]
open = "~/.local/bin/vyom tarang"

[plugin.kendra.tile.bluetooth]
open = "~/.local/bin/vyom setu"

[plugin.kendra.tile.hotspot]
command = "~/.local/bin/vayu-hotspot"
open = "~/.local/bin/vyom tarang hotspot"

[plugin.kendra.tile.dnd]
status = "cat ~/.local/state/notification-mode/current"
on_when = "^dnd$"
on = "~/.local/bin/notification-mode.sh dnd"
off = "~/.local/bin/notification-mode.sh normal"
subtitle_on = "notifications held"
subtitle_off = "off"

[plugin.kendra.tile.jyoti]
status = "~/.local/bin/jyoti-status.sh"
on_when = '"class":"(active|strong)"'
toggle = "~/.local/bin/jyoti-toggle.sh"
subtitle_on = "akhaṇḍa: stays awake"
subtitle_off = "śānta: at rest"

# ekatva, the phone link: off by default; the switch is remembered across
# reboots (ekatva-toggle.sh, read by sway-session.sh at login).
[plugin.kendra.tile.ekatva]
title = "Phone link"
icon = "\U000f011c"
color = "green"
status = "~/.local/bin/ekatva-status.sh"
on_when = '"class":"(active|strong)"'
on = "~/.local/bin/ekatva-toggle.sh on"
off = "~/.local/bin/ekatva-toggle.sh off"
open = "~/.local/bin/ekatva-open.sh"
subtitle_on = "ekatva on"
subtitle_off = "off"

# theme-toggle.sh restyles waybar, mako and the rest too, not just GTK.
[plugin.kendra.tile.theme]
status = "~/.local/bin/theme-status.sh"
on_when = '"class":"dark"'
toggle = "~/.local/bin/theme-toggle.sh"
subtitle_on = "on"
subtitle_off = "light"

[plugin.kendra.tile.wallpaper]
run = "~/.local/bin/fetch_wallpaper.sh"
subtitle = "fetch a new one"
