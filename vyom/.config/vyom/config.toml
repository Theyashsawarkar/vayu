# Vyom (github.com/Theyashsawarkar/vyom) as Vayu uses it. Each tool is its
# own repo (packages/manifest.sh VYOM_TOOLS); its settings live under
# [plugin.<name>] here, pointing it at Vayu's own scripts so state stays
# shared with waybar, mako and sway. Every key is optional: each tool's
# README lists them. Reload after editing: vyom reload

[vyom]
# Every panel opens at one size, width x height times scale (capped at
# 90% of the screen); only kendra, under the bar, keeps its own.
width = 900
height = 520
scale = 1.25
# Panel background opacity: 1 solid, lower lets more of the blurred desktop through.
opacity = 0.55
# The theme's colours (varna, Vayu's theme engine), loaded after every style.
css = ["~/.local/state/varna/vyom.css"]
# Tab inside a panel moves through these, in this order.
cycle = ["dvara", "ganit", "smriti", "bhava", "tarang", "setu", "doot", "patra", "suchana", "raga", "mudra"]

[plugin.dvara]
terminal = "kitty"

[plugin.tarang]
hotspot_command = "~/.local/bin/vayu-hotspot"

[plugin.patra]
terminal = "kitty"

# Vayu's three notification modes (normal / silent / dnd) live in
# notification-mode.sh; the switch moves between normal and dnd.
[plugin.suchana]
dnd_status = "cat ~/.local/state/notification-mode/current"
dnd_on_when = "^dnd$"
dnd_on = "~/.local/bin/notification-mode.sh dnd"
dnd_off = "~/.local/bin/notification-mode.sh normal"

[plugin.raga]
# rmpc's window, opened (or raised) once music starts playing.
player_command = "~/.local/bin/rmpc-toggle.sh"

[plugin.mudra]
source_command = "~/.local/bin/keybind-search.py --json"

# battery-limit-watch.sh nudges you to unplug at this percentage.
[plugin.urja]
limit_file = "~/.local/state/battery-limit/threshold"

[plugin.vishram]
lock = "swaylock -C ~/.config/sway/lockconfig"
logout = "swaymsg exit"

[plugin.kendra]
tiles = ["wifi", "bluetooth", "hotspot", "dnd", "caffeine", "theme", "wallpaper", "power-profile"]
lock = "swaylock -C ~/.config/sway/lockconfig"
power = "~/.local/bin/vyom vishram"

# Right click / Shift+Enter on a tile opens its full panel.
[plugin.kendra.tile.wifi]
open = "~/.local/bin/vyom tarang"

[plugin.kendra.tile.bluetooth]
open = "~/.local/bin/vyom setu"

[plugin.kendra.tile.hotspot]
command = "~/.local/bin/vayu-hotspot"
open = "~/.local/bin/vyom tarang hotspot"

[plugin.kendra.tile.dnd]
status = "cat ~/.local/state/notification-mode/current"
on_when = "^dnd$"
on = "~/.local/bin/notification-mode.sh dnd"
off = "~/.local/bin/notification-mode.sh normal"
subtitle_on = "notifications held"
subtitle_off = "off"

[plugin.kendra.tile.caffeine]
status = "~/.local/bin/caffeine-status.sh"
on_when = '"class":"active"'
toggle = "~/.local/bin/caffeine-toggle.sh"
subtitle_on = "screen stays on"
subtitle_off = "off"

# theme-toggle.sh restyles waybar, mako and the rest too, not just GTK.
[plugin.kendra.tile.theme]
status = "~/.local/bin/theme-status.sh"
on_when = '"class":"dark"'
toggle = "~/.local/bin/theme-toggle.sh"
subtitle_on = "on"
subtitle_off = "light"

[plugin.kendra.tile.wallpaper]
run = "~/.local/bin/fetch_wallpaper.sh"
subtitle = "fetch a new one"
