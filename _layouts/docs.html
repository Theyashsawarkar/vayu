<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | Vayu</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
</head>
<body class="docs-body">
<div class="topnav-wrap">
<nav class="topnav">
  <a class="brand" href="{{ '/' | relative_url }}">Vayu</a>
  <div class="navlinks">
    <a href="{{ '/' | relative_url }}#features">Features</a>
    <a href="{{ '/' | relative_url }}#install">Install</a>
    <a href="{{ '/docs/ARCHITECTURE.html' | relative_url }}">Architecture</a>
    <a href="{{ '/docs/KEYBINDINGS.html' | relative_url }}">Keybindings</a>
    <a href="{{ '/CHANGELOG.html' | relative_url }}">Changelog</a>
    <a href="https://github.com/Theyashsawarkar/vayu">GitHub</a>
  </div>
</nav>
</div>

<div class="docs-layout">
  <aside class="docs-sidebar" id="docs-toc">
    <p class="toc-label">On this page</p>
    <nav id="toc-list"><!-- built by docs.js from the real h2s below --></nav>
  </aside>
  <main class="docs-content">
    <article id="docs-article">
      {% if page.title == "Changelog" %}
      <div class="channel-toggle" id="changelog-channel-toggle" role="tablist" aria-label="Changelog channel">
        <span class="channel-thumb" aria-hidden="true"></span>
        <button type="button" class="channel-btn active" data-channel="stable" role="tab" aria-selected="true" tabindex="0">
          <span class="channel-icon" aria-hidden="true">🛡️</span>
          Stable
        </button>
        <button type="button" class="channel-btn" data-channel="nightly" role="tab" aria-selected="false" tabindex="-1">
          <span class="channel-icon" aria-hidden="true">🌙</span>
          Nightly
        </button>
      </div>
      <p class="channel-desc" id="changelog-channel-desc"></p>
      {% endif %}
      {{ content }}
    </article>
  </main>
</div>

<footer>
  <p>Vayu · MIT License · <a href="https://github.com/Theyashsawarkar/vayu/tags">Latest release</a></p>
</footer>

<script src="{{ '/assets/docs.js' | relative_url }}"></script>
<script src="{{ '/assets/copy.js' | relative_url }}"></script>
{% if page.title == "Changelog" %}
<script src="{{ '/assets/changelog-channel.js' | relative_url }}"></script>
{% endif %}
</body>
</html>
