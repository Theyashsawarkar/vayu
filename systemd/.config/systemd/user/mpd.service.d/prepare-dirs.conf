# Create the directories mpd.conf names before mpd starts (it exits with
# "Failed to access ...: No such file or directory" otherwise).
#
# RuntimeDirectory: $XDG_RUNTIME_DIR/mpd, for the socket in mpd.conf. Without
# it the socket's bind fails, and as "localhost" binds fine mpd says nothing
# and keeps running with no socket, so whatever uses MPD_HOST can't reach it.
[Service]
RuntimeDirectory=mpd
ExecStartPre=%h/.local/bin/mpd-prepare-dirs.sh
