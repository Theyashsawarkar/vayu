# waybar as its unit (sway-session.sh starts it), not a bare sway `exec`:
# a crash used to leave no bar until the next login.
[Unit]
StartLimitIntervalSec=0
[Service]
# waybar refuses to start without its theme files: write any that's missing.
ExecStartPre=-%h/.local/bin/vayu-theme-ensure
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
