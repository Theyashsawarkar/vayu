# One mako, owned by systemd. sway used to start its own copy as well, and
# whichever came second (that one, or this unit D-Bus-activated by an early
# notification) failed with "Failed to acquire service name": mako.service
# was failed every session, and sway's copy was never restarted on a crash.
# sway-session.sh starts this right after importing WAYLAND_DISPLAY.
[Service]
# mako refuses to start without its theme file: write any that's missing.
ExecStartPre=-%h/.local/bin/vayu-theme-ensure
Restart=on-failure
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
[Unit]
StartLimitIntervalSec=0
