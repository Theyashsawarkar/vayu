# Magic SysRq: allow sync (16), remount read-only (32) and reboot/power-off
# (128), nothing that dumps memory or kills processes. systemd's
# 50-default.conf sets 16 (sync only); this file sorts after it.
#
# The way out of a shutdown that hangs at the very end. That last stage no
# longer has a watchdog (/etc/systemd/system.conf.d/no-reboot-watchdog.conf),
# so instead of holding the power button: hold Alt+PrtSc and press S (sync),
# U (remount read-only), then B (reboot) or O (power off), a second apart.
# See docs/TROUBLESHOOTING.md. Listed in the keybinding search:
# keybind: Kernel | Alt+PrtSc, then S U B | Force reboot a hung machine (SysRq: sync, remount read-only, reboot)
# keybind: Kernel | Alt+PrtSc, then S U O | Force power-off of a hung machine (SysRq: sync, remount read-only, power off)
kernel.sysrq = 176
