# Swap here is zram first (zram-generator.conf, priority 100), /swapfile on
# the NVMe only as overflow. Compressed RAM is far cheaper to swap to than
# to drop page cache and re-read it, so these favour swapping early, the
# ArchWiki zram values (originally Pop!_OS's). The old swappiness=10 was a
# disk-swap setting: it kept zram almost unused, so memory pressure evicted
# cache instead.
vm.swappiness = 180
# zram has no seek cost: read single pages, not clusters of 8.
vm.page-cluster = 0
# No extra reclaim bursts after fragmentation events; start reclaim a
# little earlier instead, so allocations rarely stall.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
