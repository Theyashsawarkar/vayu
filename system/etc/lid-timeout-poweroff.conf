# Config for /etc/systemd/system-sleep/lid-timeout-poweroff
# Installed as /etc/lid-timeout-poweroff.conf (root-owned, not stowed) by
# system/apply.sh, which install.sh runs.

# How long (seconds) the lid must stay continuously closed before this
# powers the machine off for real. 1800 = 30 minutes.
TIMEOUT_SECONDS=1800

# Set to 1 to test safely: skips the real `systemctl poweroff` and fires
# a notification instead, so you can verify the whole close-lid -> wait
# -> resume -> detect-still-closed pipeline without actually losing your
# session. Set back to 0 for real use.
DRY_RUN=0
