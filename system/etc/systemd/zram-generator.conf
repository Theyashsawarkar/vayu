[zram0]
# zstd packs ~3:1 on desktop memory vs ~2:1 for lz4; on this 4-thread
# Ryzen the extra CPU is negligible next to reading /swapfile instead.
compression-algorithm = zstd
# The default is min(ram / 2, 4G). It holds compressed pages, so a device
# the size of RAM costs nothing until used and roughly doubles the memory
# headroom before /swapfile is touched.
zram-size = min(ram, 8192)
