[Manager]
# Don't arm the hardware watchdog (sp5100_tco) for reboot/power-off. With the
# default 10 min, PID 1 closes the armed watchdog when it hands over to
# systemd-shutdown, and the kernel prints "watchdog: watchdog0: watchdog did
# not stop!" at crit level, which passes loglevel=3 and shows as a line of
# text after the Vayu shutdown logo. The cost: a shutdown that hangs stays
# hung instead of being reset after 10 min; sysctl.d/99-sysrq.conf enables
# Alt+SysRq S U B/O as the way out (see docs/TROUBLESHOOTING.md).
RebootWatchdogSec=0
